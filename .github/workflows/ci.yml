name: Java构建与接口验收
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java测试与可执行JAR
        run: mvn -B clean verify
      - name: 前端语法
        run: |
          node --check "01_前端界面/api.js"
          node --check "01_前端界面/app.js"
      - name: Windows启动脚本与进程重启验收
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-jar.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results-${{ matrix.os }}
          path: |
            backend-java/target/surefire-reports/
            06_系统测试/results-java/jar-*
      - uses: actions/upload-artifact@v4
        with:
          name: online-shopping-java-${{ matrix.os }}
          path: backend-java/target/online-shopping.jar
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建并验证Java容器
        shell: bash
        run: |
          docker build -t online-shopping-java:0.2.0 .
          docker run -d --name shopping-check -p 127.0.0.1:8000:8000 online-shopping-java:0.2.0
          trap 'docker logs shopping-check; docker rm -f shopping-check' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/product > /tmp/product.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          jq -e '.product == null' /tmp/product.json
